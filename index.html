<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search-box">
                <input type="text" placeholder="Enter Your Location" class="input-box">
                <button class="fa-solid fa-magnifying-glass" id="searchBtn"> </button>
            </div>
        </div>
        <div class="location-not-found" disabled>
            <h1> Sorry, Location not found!!!</h1>
            <img src="./404.png" alt="404 error" />
        </div>
        <div class="weather-body">
            <img src="./04d.png" alt="weather Image" class="weather-img" >
            <div class="weather-box">
                 <h1 class="city-name" id="cityName">Noida</h1>
                <p class="temperature">0<sup>°C</sup></p>
                <p class="description">Light Rain</p>
            </div>
            <div class="weather-details"> 

                <div class="details-box">

                    <div class="humidity">
                        <i class="fa-sharp fa-solid fa-droplet"></i>
                        <div class="text">
                            <span id="humidity">45%</span>
                            <p>Humidity</p>
                        </div>
                    </div>

                    <div class="wind">
                        <i class="fa-solid fa-wind"></i>
                        <div class="text">
                            <span id="wind-speed">12 m/s</span>
                            <p>Wind Speed</p>
                        </div>
                    </div>

                    <div class="feels-like">
                        <i class="fa-solid fa-thermometer-half"></i>
                        <div class="text">
                            <span id="feels-like">5°C</span>
                            <p>Feels Like</p>
                        </div>
                    </div>

                    <div class="pressure">
                        <i class="fa-solid fa-tachometer-alt"></i>
                        <div class="text">
                            <span id="pressure">1013 hPa</span>
                            <p>Pressure</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        
        <div class="forecast-details">
            <button class="forecast-btn">Forecast</button>
            <canvas id="forecastChart" style="display: none;"></canvas> 
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
